# =============================================================================
# STP plant configuration — archive-only track. Saeng Thai Phalangngan (EGAT
# UDT2, Khok Sa-at Udon Thani). Metadata from Historic Forecast Evaluation Data
# (PVsyst VC5 + CAD SO-UDT2). Same archive/Solcast caveats as prr.yaml; PlantModel
# still incomplete until module.temp_coefficient_pct_per_C (gamma) is known.
# =============================================================================

plant:
  id: "STP"
  name: "Saeng Thai Phalangngan Co., Ltd."   # EGAT UDT2, Khok Sa-at Udon Thani

location:
  latitude: 17.3663     # CONFIRMED — PVsyst VC5; supersedes solar-geometry estimates 10.12/98.08/50
  longitude: 102.6527   # CONFIRMED — PVsyst
  altitude_m: 215       # CONFIRMED — PVsyst
  timezone: "Asia/Bangkok"   # CONFIRMED

nameplate:
  dc_capacity: 77.3175        # CONFIRMED — CAD / PVsyst metadata
  ac_capacity: 58.56          # CONFIRMED — CAD AC rating
  inverter_clip_at: 58.56     # CONFIRMED
  dispatch_cap: 58              # CONFIRMED — PPA (MW)

array:
  tilt_deg: 12              # CONFIRMED — PVsyst
  azimuth_deg: 180          # CONFIRMED — PVsyst 0=south -> pvlib 180 south
  tracking: "fixed"         # CONFIRMED — PVsyst
  single_axis: {axis_tilt_deg: null, axis_azimuth_deg: null, max_angle_deg: null, backtrack: null}

bifacial:
  is_bifacial: true
  rear_gain_factor: null
  measured_rear_poa_available: false

module:
  temp_coefficient_pct_per_C: null
  stc: {irradiance_w_m2: 1000, cell_temp_c: 25}
  operating_cell_temp_c: 50   # ESTIMATED — PVsyst VC5 p.4 "At operating cond. (50°C)"
  thermal_model: null

units:
  power: "MW"
  irradiance: "W/m^2"
  temperature: "C"

data:
  csv_paths:
    actual: "Plant_data/STP_Plant/STP_actual.csv"
    dayahead: "Plant_data/STP_Plant/STP_daily__starting-at-0000[UTC+7]__issued-at-0800[UTC+7]-yesterday.csv"
  expected_date_range:
    start: "2025-01-01"
    end: "2026-05-01"
  expected_resolution_min: 15

split:
  train_start: "2025-01-01"
  train_end: "2025-11-30"
  test_start: "2025-12-01"
  test_end: "2026-05-01"

models: {}

estimated:
  location: {latitude: false, longitude: false, altitude_m: false}
  module: {operating_cell_temp_c: true}

estimation_notes:
  location: >
    Coordinates CONFIRMED from PVsyst VC5 / CAD SO-UDT2 (Historic Forecast
    Evaluation Data/). Prior values 10.12/98.08/50 were solar-geometry inversion
    from Solcast ghi — superseded.
  nameplate: >
    Prior ac_capacity 49.11 MW was the observed max of Solcast pv_power_premium
    in STP_actual.csv, not plant nameplate. CAD/PVsyst nameplate is dc 77.3175 /
    ac 58.56 MW with dispatch_cap 58 MW PPA.
  power_validation: >
    Archived Solcast actual/dayahead series remain unvalidated against ground
    irradiance or revenue-meter power. Every STP result downstream is labeled
    "unvalidated against ground truth".
  module: >
    operating_cell_temp_c 50 °C from PVsyst VC5 report p.4 "At operating cond. (50°C)".
    module.stc.cell_temp_c remains 25 IEC STC.
