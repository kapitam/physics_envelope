# =============================================================================
# PRR plant configuration — archive-only track (no ground sensors, no metered
# power in the repo; EXTERNAL_REQUIREMENTS.md #1a/#1b). Array geometry and
# nameplate from Historic Forecast Evaluation Data (PVsyst VC6 + CAD SO-UDT4).
# PlantModel (physical/) is still NOT run for archive forecasting (Solcast
# series via data/archive_loader.py). PlantModel would remain incomplete until
# module.temp_coefficient_pct_per_C (gamma) is known — field left null.
# =============================================================================

plant:
  id: "PRR"
  name: "Phalangngan Rungrueang Co., Ltd."   # EGAT UDT4, Mueang Udon Thani; PVsyst spelling Rungrueng

location:
  latitude: 17.5464     # CONFIRMED — PVsyst VC6; supersedes solar-geometry estimates 11.26/100.52/50
  longitude: 102.8461   # CONFIRMED — PVsyst
  altitude_m: 188       # CONFIRMED — PVsyst
  timezone: "Asia/Bangkok"   # CONFIRMED — filenames say "[UTC+7]"; period_end columns are UTC

nameplate:
  dc_capacity: 72.67          # CONFIRMED — CAD / PVsyst metadata
  ac_capacity: 55.04          # CONFIRMED — CAD AC rating
  inverter_clip_at: 55.04     # CONFIRMED
  dispatch_cap: 54              # CONFIRMED — PPA (MW)

array:
  tilt_deg: 12              # CONFIRMED — PVsyst
  azimuth_deg: 180          # CONFIRMED — PVsyst 0=south -> pvlib 180 south
  tracking: "fixed"         # CONFIRMED — PVsyst
  single_axis: {axis_tilt_deg: null, axis_azimuth_deg: null, max_angle_deg: null, backtrack: null}

bifacial:
  is_bifacial: true
  rear_gain_factor: null
  measured_rear_poa_available: false

module:
  temp_coefficient_pct_per_C: null
  stc: {irradiance_w_m2: 1000, cell_temp_c: 25}
  operating_cell_temp_c: 50   # ESTIMATED — PVsyst VC6 p.4 "At operating cond. (50°C)"
  thermal_model: null

units:
  power: "MW"
  irradiance: "W/m^2"
  temperature: "C"

data:
  csv_paths:
    actual: "Plant_data/PRR_Plant/PRR_actual.csv"
    dayahead: "Plant_data/PRR_Plant/PRR_daily__starting-at-0000[UTC+7]__issued-at-0800[UTC+7]-yesterday.csv"
  expected_date_range:
    start: "2025-01-01"
    end: "2026-05-01"
  expected_resolution_min: 15   # CONFIRMED — PT15M periods, period_end = interval END, UTC

split:
  train_start: "2025-01-01"
  train_end: "2025-11-30"
  test_start: "2025-12-01"
  test_end: "2026-05-01"

models: {}

estimated:
  location: {latitude: false, longitude: false, altitude_m: false}
  module: {operating_cell_temp_c: true}

estimation_notes:
  location: >
    Coordinates CONFIRMED from PVsyst VC6 / CAD SO-UDT4 (Historic Forecast
    Evaluation Data/). Prior values 11.26/100.52/50 were solar-geometry inversion
    from Solcast ghi — superseded.
  nameplate: >
    Prior ac_capacity 59.07 MW was the observed max of Solcast pv_power_premium
    in PRR_actual.csv, not plant nameplate. CAD/PVsyst nameplate is dc 72.67 /
    ac 55.04 MW with dispatch_cap 54 MW PPA.
  power_validation: >
    Archived Solcast actual/dayahead series remain unvalidated against ground
    irradiance or revenue-meter power. Every PRR result downstream is labeled
    "unvalidated against ground truth" per FORECAST_SYSTEM_PLAN.md.
  module: >
    operating_cell_temp_c 50 °C from PVsyst VC6 report p.4 "At operating cond. (50°C)".
    module.stc.cell_temp_c remains 25 IEC STC.
